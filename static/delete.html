<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team IA - Index de Herramientas</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fuente nativa del sistema para no depender de Google Fonts */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #f9fafb; /* Gray 50 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #1f2937; /* Gray 800 */
        }

        /* Contenedor Principal (Card) */
        .card {
            background-color: #ffffff;
            border-radius: 1.5rem; /* rounded-3xl */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); /* shadow-2xl */
            width: 100%;
            max-width: 56rem; /* max-w-4xl */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #f3f4f6;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3); /* hover:shadow-3xl sim */
        }

        @media (min-width: 768px) {
            .card {
                flex-direction: row;
            }
        }

        /* Sección Izquierda: Logo */
        .left-section {
            width: 100%;
            background-color: #f9fafb;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f3f4f6;
            position: relative;
        }

        @media (min-width: 768px) {
            .left-section {
                width: 41.666667%; /* w-5/12 */
                border-bottom: none;
                border-right: 1px solid #f3f4f6;
            }
        }

        /* Fondo sutil */
        .left-bg-effect {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom right, #ffffff, #f3f4f6);
            opacity: 0.5;
            z-index: 0;
        }

        .logo-container {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: transform 0.5s ease;
        }

        .left-section:hover .logo-container {
            transform: scale(1.05);
        }

        .logo-box {
            background-color: white;
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            margin-bottom: 0.75rem;
            display: inline-block;
        }

        .logo-img {
            height: 4rem;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .logo-img {
                height: 5rem;
            }
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #374151; /* Gray 700 */
            letter-spacing: -0.025em;
            margin-top: 0.5rem;
        }

        @media (min-width: 768px) {
            .brand-title {
                font-size: 1.5rem;
            }
        }

        .text-red {
            color: #dc2626; /* Red 600 */
        }

        .brand-underline {
            height: 0.25rem;
            width: 4rem;
            background-color: #dc2626;
            margin: 0.75rem auto 0;
            border-radius: 9999px;
        }

        /* Sección Derecha: Lista */
        .right-section {
            width: 100%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: white;
        }

        @media (min-width: 768px) {
            .right-section {
                width: 58.333333%; /* w-7/12 */
                padding: 3.5rem;
            }
        }

        .header-title {
            font-size: 1.875rem; /* 3xl */
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        @media (min-width: 768px) {
            .header-title {
                font-size: 2.25rem; /* 4xl */
            }
        }

        .subtitle {
            color: #9ca3af; /* Gray 400 */
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
        }

        /* Navegación y Links */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* space-y-6 */
        }

        .tool-link {
            text-decoration: none;
            display: flex;
            align-items: center;
            font-size: 1.25rem; /* xl */
            font-weight: 600;
            color: #4b5563; /* Gray 600 */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* La línea animada */
        .line-indicator {
            height: 0.125rem; /* h-0.5 */
            width: 2rem; /* w-8 */
            background-color: #d1d5db; /* Gray 300 */
            margin-right: 1rem;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        /* Iconos SVG */
        .icon-svg {
            margin-left: auto;
            width: 1.25rem;
            height: 1.25rem;
            opacity: 0;
            color: #ef4444; /* Red 500 */
            transition: opacity 0.3s ease;
        }

        /* Hover Effects */
        .tool-link:hover {
            color: #ef4444; /* Red corporativo */
            transform: translateX(5px);
        }

        .tool-link:hover .line-indicator {
            width: 3rem; /* Crece la línea */
            background-color: #ef4444;
        }

        .tool-link:hover .icon-svg {
            opacity: 1;
        }

        /* Footer */
        .card-footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #9ca3af;
        }

    </style>
</head>
<body>

    <div class="card">
        
        <!-- SECCIÓN IZQUIERDA: LOGO -->
        <div class="left-section">
            <div class="left-bg-effect"></div>
            
            <div class="logo-container">
                <div class="logo-box">
                    <!-- Asegúrate de que la imagen esté en la carpeta del servidor -->
                    <img src="image_2e131c.jpg" alt="Logo Davivienda" class="logo-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-weight:bold; color:#dc2626;\'>LOGO</span>'">
                </div>
                
                <h2 class="brand-title">
                    Inteligencia <span class="text-red">Artificial</span>
                </h2>
                <div class="brand-underline"></div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: LISTA DE TOOLS -->
        <div class="right-section">
            
            <div>
                <h1 class="header-title">Team <br/><span class="text-red">Inteligencia Artificial</span></h1>
                <p class="subtitle">Portal de Acceso</p>
            </div>

            <nav class="nav-list">
                
                <!-- Tool 1: Generador de Prompts -->
                <a href="#" class="tool-link">
                    <span class="line-indicator"></span>
                    <span>Generador de Prompts</span>
                    <!-- Icono Sparkles -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 9h4"/><path d="M3 5h4"/></svg>
                </a>

                <!-- Tool 2: Análisis de Datos -->
                <a href="#" class="tool-link">
                    <span class="line-indicator"></span>
                    <span>Análisis de Datos</span>
                    <!-- Icono Bar Chart -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                </a>

                <!-- Tool 3: Chatbot Interno -->
                <a href="#" class="tool-link">
                    <span class="line-indicator"></span>
                    <span>Chatbot Interno</span>
                    <!-- Icono Message Square -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </a>

                 <!-- Tool 4: Documentación API -->
                 <a href="#" class="tool-link">
                    <span class="line-indicator"></span>
                    <span>Documentación API</span>
                    <!-- Icono File Code -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><polyline points="16 13 21 13"></polyline><polyline points="16 17 21 17"></polyline><polyline points="10 13 8 13"></polyline><polyline points="8 13 8 17"></polyline><polyline points="8 17 10 17"></polyline></svg>
                </a>

            </nav>

            <div class="card-footer">
                <span>v 1.0.2</span>
                <span>Solo uso interno</span>
            </div>
        </div>

    </div>

</body>
</html>
