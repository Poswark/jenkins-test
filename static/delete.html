<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team IA - Index de Herramientas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .tool-link:hover .line-indicator {
            width: 3rem; /* La línea crece al pasar el mouse */
            background-color: #EF4444; /* Color rojo corporativo */
        }
        .tool-link:hover {
            color: #EF4444;
            transform: translateX(5px);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal (Card) -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col md:flex-row transition-all duration-300 hover:shadow-3xl border border-gray-100">
        
        <!-- SECCIÓN IZQUIERDA: LOGO -->
        <div class="w-full md:w-5/12 bg-gray-50 p-10 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-100 relative group">
            <!-- Efecto de fondo sutil -->
            <div class="absolute inset-0 bg-gradient-to-br from-white to-gray-100 opacity-50"></div>
            
            <div class="relative z-10 text-center transform transition-transform duration-500 group-hover:scale-105">
                <!-- Imagen del Logo (Usando el archivo subido si está disponible, o un placeholder) -->
                <div class="bg-white p-4 rounded-xl shadow-sm mb-3 inline-block">
                     <!-- Nota: Asegúrate de que la imagen 'image_2e131c.jpg' esté en la misma carpeta o actualiza la ruta -->
                    <img src="image_2e131c.jpg" alt="Logo None" class="h-16 md:h-20 object-contain mx-auto" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/NONE_logo.svg/2560px-NONE_logo.svg.png'">
                </div>
                
                <!-- El texto añadido "Inteligencia Artificial" -->
                <h2 class="text-xl md:text-2xl font-bold text-gray-700 tracking-tight mt-2">
                    Inteligencia <span class="text-red-600">Artificial</span>
                </h2>
                <div class="h-1 w-16 bg-red-600 mx-auto mt-3 rounded-full"></div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: LISTA DE TOOLS -->
        <div class="w-full md:w-7/12 p-10 md:p-14 flex flex-col justify-center bg-white">
            
            <div class="mb-10">
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">Team <br/><span class="text-red-600">Inteligencia Artificial</span></h1>
                <p class="text-gray-400 text-sm font-medium uppercase tracking-widest">Portal de Acceso</p>
            </div>

            <!-- Lista de Enlaces (Esquema del boceto) -->
            <nav class="space-y-6">
                
                <!-- Tool 1 -->
                <a href="#" class="tool-link group flex items-center text-xl font-semibold text-gray-600 transition-all duration-300">
                    <!-- La línea del boceto -->
                    <span class="line-indicator h-0.5 w-8 bg-gray-300 mr-4 transition-all duration-300 rounded-full"></span>
                    <span>Generador de Prompts</span>
                    <i data-lucide="sparkles" class="ml-auto w-5 h-5 opacity-0 group-hover:opacity-100 transition-opacity text-red-500"></i>
                </a>

                <!-- Tool 2 -->
                <a href="#" class="tool-link group flex items-center text-xl font-semibold text-gray-600 transition-all duration-300">
                    <span class="line-indicator h-0.5 w-8 bg-gray-300 mr-4 transition-all duration-300 rounded-full"></span>
                    <span>Análisis de Datos</span>
                    <i data-lucide="bar-chart-2" class="ml-auto w-5 h-5 opacity-0 group-hover:opacity-100 transition-opacity text-red-500"></i>
                </a>

                <!-- Tool 3 -->
                <a href="#" class="tool-link group flex items-center text-xl font-semibold text-gray-600 transition-all duration-300">
                    <span class="line-indicator h-0.5 w-8 bg-gray-300 mr-4 transition-all duration-300 rounded-full"></span>
                    <span>Chatbot Interno</span>
                    <i data-lucide="message-square" class="ml-auto w-5 h-5 opacity-0 group-hover:opacity-100 transition-opacity text-red-500"></i>
                </a>

                 <!-- Tool 4 -->
                 <a href="#" class="tool-link group flex items-center text-xl font-semibold text-gray-600 transition-all duration-300">
                    <span class="line-indicator h-0.5 w-8 bg-gray-300 mr-4 transition-all duration-300 rounded-full"></span>
                    <span>Documentación API</span>
                    <i data-lucide="file-code" class="ml-auto w-5 h-5 opacity-0 group-hover:opacity-100 transition-opacity text-red-500"></i>
                </a>

            </nav>

            <div class="mt-12 pt-6 border-t border-gray-100 flex justify-between items-center text-xs text-gray-400">
                <span>v 1.0.2</span>
                <span>Solo uso interno</span>
            </div>
        </div>

    </div>

    <script>
        // Inicializar iconos
        lucide.createIcons();
    </script>
</body>
</html>
